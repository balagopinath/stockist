version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir src
frontend:
  phases:
    build:
      commands:
        # Build into out/stockist so the app is served at /stockist/ on this
        # app's own domain too; www.gopsweb.com/stockist proxies to it unchanged.
        - CI=false BUILD_PATH=out/stockist npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
